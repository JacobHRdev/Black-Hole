<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mecánica de Fluidos</title>
    <style>
      :root {
        --bg: #091018;
        --panel: #0f1720cc;
        --accent: #ffb86b;
        --muted: #9aa6b2;
        --glass: rgba(255, 255, 255, 0.04);
      }

      html,
      body {
        height: 100%;
        margin: 0;
        font-family: Inter, Roboto, "Helvetica Neue", Arial;
        background: linear-gradient(180deg, #071023 0%, #0b1320 70%);
        color: #e6eef6;
      }

      .wrap {
        display: flex;
        height: 100vh;
        gap: 18px;
        padding: 18px;
        box-sizing: border-box;
      }

      .canvas-wrap {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      canvas {
        background: radial-gradient(
            circle at 70% 20%,
            rgba(255, 240, 170, 0.02),
            transparent 10%
          ),
          #071123;
        border-radius: 8px;
        box-shadow: 0 6px 30px rgba(0, 0, 0, 0.6),
          inset 0 1px 0 rgba(255, 255, 255, 0.03);
      }

      .panel {
        width: 360px;
        background: var(--panel);
        border-radius: 10px;
        padding: 14px;
        box-sizing: border-box;
        backdrop-filter: blur(6px);
      }

      h1 {
        margin: 4px 0 10px 0;
        font-size: 16px;
        color: var(--accent);
      }

      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
      }

      label {
        font-size: 13px;
        color: var(--muted);
        min-width: 120px;
      }

      input[type="range"] {
        flex: 1;
      }

      .val {
        width: 60px;
        text-align: right;
        color: #dfeaf5;
        font-weight: 600;
      }

      button {
        background: var(--glass);
        border: 1px solid rgba(255, 255, 255, 0.03);
        color: #eaf2ff;
        padding: 8px 10px;
        border-radius: 8px;
        cursor: pointer;
      }

      .btn-row {
        display: flex;
        gap: 8px;
        margin-top: 8px;
        flex-wrap: wrap;
      }

      .footer {
        margin-top: 10px;
        font-size: 12px;
        color: var(--muted);
      }

      .small {
        font-size: 13px;
        color: var(--muted);
      }

      .help {
        margin-top: 8px;
        font-size: 13px;
        color: var(--muted);
        line-height: 1.35;
      }

      .toggle {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .legend {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 8px;
      }

      .legend .box {
        width: 18px;
        height: 12px;
        border-radius: 3px;
      }

      @media (max-width: 980px) {
        .wrap {
          flex-direction: column;
        }

        .panel {
          width: auto;
        }
      }
    </style>
  </head>

  <body>
    <div class="wrap">
      <div class="canvas-wrap">
        <canvas id="fluidCanvas" width="960" height="600"></canvas>
      </div>

      <div class="panel">
        <h1>Mecánica de Fluidos - Simulación</h1>

        <div class="row">
          <label>Resolución (grid)</label>
          <select id="resSelect">
            <option value="96">96 × 64</option>
            <option value="128" selected>128 × 96</option>
            <option value="160">160 × 120</option>
            <option value="200">200 × 150</option>
          </select>
          <div class="val small" id="infoCells">cells</div>
        </div>

        <div class="row">
          <label>Viscosidad (ν)</label>
          <input
            id="visc"
            type="range"
            min="0"
            max="0.02"
            step="0.0005"
            value="0.0005"
          />
          <div class="val" id="viscVal">0.0005</div>
        </div>

        <div class="row">
          <label>Difusión (ρ)</label>
          <input
            id="diff"
            type="range"
            min="0"
            max="0.02"
            step="0.0005"
            value="0.0005"
          />
          <div class="val" id="diffVal">0.0005</div>
        </div>

        <div class="row">
          <label>Intensidad fuente</label>
          <input
            id="src"
            type="range"
            min="10"
            max="1200"
            step="5"
            value="200"
          />
          <div class="val" id="srcVal">200</div>
        </div>

        <div class="row">
          <label>Fuerza al arrastrar</label>
          <input
            id="force"
            type="range"
            min="100"
            max="6000"
            step="50"
            value="2000"
          />
          <div class="val" id="forceVal">2000</div>
        </div>

        <div class="row">
          <label>Iteraciones del solver</label>
          <input id="iters" type="range" min="1" max="60" step="1" value="20" />
          <div class="val" id="itersVal">20</div>
        </div>

        <div class="row">
          <label>Vorticity confinement</label>
          <input id="vortToggle" type="checkbox" checked />
          <div class="val small" id="vortVal">ON</div>
        </div>

        <div class="btn-row">
          <button id="pauseBtn">Pausa</button>
          <button id="clearBtn">Limpiar</button>
          <button id="spawnBtn">Fuente circular</button>
          <button id="randomBtn">Aleatorizar</button>
          <button id="exportPNG">Export PNG</button>
        </div>

        <div class="help">
          <strong>Interacción:</strong> arrastra (izq) = añadir humo + fuerza,
          arrastra (derecha) = fuerza. En móvil: toque/arrastre añade humo.
        </div>

        <div class="footer">
          <div class="small">
            Modelo: advección semi-Lagrangiana • difusión por Gauss-Seidel •
            proyección (incompresibilidad).
          </div>
        </div>
      </div>
    </div>

    <script>
      (() => {
        const canvas = document.getElementById("fluidCanvas");
        const ctx = canvas.getContext("2d");

        let GRID_W = 160,
          GRID_H = 120;
        let SCALE = 4;
        let width = canvas.width,
          height = canvas.height;

        const resSelect = document.getElementById("resSelect");
        const viscSlider = document.getElementById("visc");
        const diffSlider = document.getElementById("diff");
        const srcSlider = document.getElementById("src");
        const forceSlider = document.getElementById("force");
        const itersSlider = document.getElementById("iters");
        const vortToggle = document.getElementById("vortToggle");

        const pauseBtn = document.getElementById("pauseBtn");
        const clearBtn = document.getElementById("clearBtn");
        const spawnBtn = document.getElementById("spawnBtn");
        const randomBtn = document.getElementById("randomBtn");
        const exportPNG = document.getElementById("exportPNG");

        const viscVal = document.getElementById("viscVal");
        const diffVal = document.getElementById("diffVal");
        const srcVal = document.getElementById("srcVal");
        const forceVal = document.getElementById("forceVal");
        const itersVal = document.getElementById("itersVal");
        const vortVal = document.getElementById("vortVal");
        const infoCells = document.getElementById("infoCells");

        let N, size;
        let dt = 0.12;
        let viscosity = parseFloat(viscSlider.value);
        let diffusion = parseFloat(diffSlider.value);
        let sourceAmount = parseFloat(srcSlider.value);
        let forceStrength = parseFloat(forceSlider.value);
        let solverIters = parseInt(itersSlider.value, 10);
        let vorticity_conf = vortToggle.checked;
        let u, v, u_prev, v_prev, dens, dens_prev;
        let curl, Nx, Ny;
        let paused = false;
        let mouseDown = false,
          rightDown = false;
        let lastX = 0,
          lastY = 0;

        function initGridFromSelect() {
          const sel = parseInt(resSelect.value, 10);
          GRID_W = sel;
          GRID_H = Math.round((canvas.height / canvas.width) * GRID_W);
          if (GRID_H < 32) GRID_H = 32;
          N = GRID_W;
          size = GRID_W * GRID_H;
          SCALE = Math.floor(
            Math.min(canvas.width / GRID_W, canvas.height / GRID_H)
          );
          createArrays();
          clearFields();
          infoCells.textContent = `${GRID_W}×${GRID_H}`;
        }

        function createArrays() {
          u = new Float32Array(size);
          v = new Float32Array(size);
          u_prev = new Float32Array(size);
          v_prev = new Float32Array(size);
          dens = new Float32Array(size);
          dens_prev = new Float32Array(size);
          curl = new Float32Array(size);
          Nx = new Float32Array(size);
          Ny = new Float32Array(size);
        }

        function IX(i, j) {
          if (i < 0) i = 0;
          if (i >= N) i = N - 1;
          if (j < 0) j = 0;
          if (j >= GRID_H) j = GRID_H - 1;
          return i + j * N;
        }

        function clearFields() {
          for (let i = 0; i < size; i++) {
            u[i] = v[i] = u_prev[i] = v_prev[i] = dens[i] = dens_prev[i] = 0;
            curl[i] = Nx[i] = Ny[i] = 0;
          }
        }

        function addSource(x, s, dtLocal) {
          for (let i = 0; i < size; i++) x[i] += s[i] * dtLocal;
        }

        function diffuse(b, x, x0, diff, dtLocal) {
          const a = dtLocal * diff * (N - 1) * (GRID_H - 1);
          for (let k = 0; k < solverIters; k++) {
            for (let j = 1; j < GRID_H - 1; j++) {
              let row = j * N;
              for (let i = 1; i < N - 1; i++) {
                const idx = row + i;
                x[idx] =
                  (x0[idx] +
                    a * (x[idx - 1] + x[idx + 1] + x[idx - N] + x[idx + N])) /
                  (1 + 4 * a);
              }
            }
            setBnd(b, x);
          }
        }

        function advect(b, d, d0, ufield, vfield, dtLocal) {
          const Wm = N - 1,
            Hm = GRID_H - 1;
          for (let j = 0; j < GRID_H; j++) {
            for (let i = 0; i < N; i++) {
              const idx = i + j * N;
              let x = i - dtLocal * ufield[idx] * Wm;
              let y = j - dtLocal * vfield[idx] * Hm;
              if (x < 0.5) x = 0.5;
              if (x > Wm + 0.5) x = Wm + 0.5;
              let i0 = Math.floor(x),
                i1 = i0 + 1;
              if (y < 0.5) y = 0.5;
              if (y > Hm + 0.5) y = Hm + 0.5;
              let j0 = Math.floor(y),
                j1 = j0 + 1;
              const s1 = x - i0,
                s0 = 1 - s1;
              const t1 = y - j0,
                t0 = 1 - t1;
              d[idx] =
                s0 * (t0 * d0[IX(i0, j0)] + t1 * d0[IX(i0, j1)]) +
                s1 * (t0 * d0[IX(i1, j0)] + t1 * d0[IX(i1, j1)]);
            }
          }
          setBnd(b, d);
        }

        function project(uField, vField, p, div) {
          const h = 1.0 / N;
          for (let j = 1; j < GRID_H - 1; j++) {
            for (let i = 1; i < N - 1; i++) {
              const idx = i + j * N;
              div[idx] =
                -0.5 *
                h *
                (uField[idx + 1] -
                  uField[idx - 1] +
                  vField[idx + N] -
                  vField[idx - N]);
              p[idx] = 0;
            }
          }
          setBnd(0, div);
          setBnd(0, p);
          for (let k = 0; k < solverIters; k++) {
            for (let j = 1; j < GRID_H - 1; j++) {
              for (let i = 1; i < N - 1; i++) {
                const idx = i + j * N;
                p[idx] =
                  (div[idx] +
                    p[idx - 1] +
                    p[idx + 1] +
                    p[idx - N] +
                    p[idx + N]) /
                  4;
              }
            }
            setBnd(0, p);
          }
          for (let j = 1; j < GRID_H - 1; j++) {
            for (let i = 1; i < N - 1; i++) {
              const idx = i + j * N;
              uField[idx] -= (0.5 * (p[idx + 1] - p[idx - 1])) / h;
              vField[idx] -= (0.5 * (p[idx + N] - p[idx - N])) / h;
            }
          }
          setBnd(1, uField);
          setBnd(2, vField);
        }

        function setBnd(b, x) {
          for (let i = 1; i < N - 1; i++) {
            x[IX(i, 0)] = x[IX(i, 1)];
            x[IX(i, GRID_H - 1)] = x[IX(i, GRID_H - 2)];
          }
          for (let j = 1; j < GRID_H - 1; j++) {
            x[IX(0, j)] = x[IX(1, j)];
            x[IX(N - 1, j)] = x[IX(N - 2, j)];
          }
          x[IX(0, 0)] = 0.5 * (x[IX(1, 0)] + x[IX(0, 1)]);
          x[IX(0, GRID_H - 1)] =
            0.5 * (x[IX(1, GRID_H - 1)] + x[IX(0, GRID_H - 2)]);
          x[IX(N - 1, 0)] = 0.5 * (x[IX(N - 2, 0)] + x[IX(N - 1, 1)]);
          x[IX(N - 1, GRID_H - 1)] =
            0.5 * (x[IX(N - 2, GRID_H - 1)] + x[IX(N - 1, GRID_H - 2)]);
        }

        function vorticityConfinement(uField, vField) {
          for (let j = 1; j < GRID_H - 1; j++) {
            for (let i = 1; i < N - 1; i++) {
              const idx = i + j * N;
              const du_dy = (uField[IX(i, j + 1)] - uField[IX(i, j - 1)]) * 0.5;
              const dv_dx = (vField[IX(i + 1, j)] - vField[IX(i - 1, j)]) * 0.5;
              curl[idx] = Math.abs(dv_dx - du_dy);
            }
          }
          for (let j = 2; j < GRID_H - 2; j++) {
            for (let i = 2; i < N - 2; i++) {
              const idx = i + j * N;
              const Nx_val = (curl[IX(i + 1, j)] - curl[IX(i - 1, j)]) * 0.5;
              const Ny_val = (curl[IX(i, j + 1)] - curl[IX(i, j - 1)]) * 0.5;
              let len = Math.hypot(Nx_val, Ny_val) + 1e-6;
              const Nx_n = Nx_val / len,
                Ny_n = Ny_val / len;
              const vort =
                (vField[IX(i + 1, j)] - vField[IX(i - 1, j)]) * 0.5 -
                (uField[IX(i, j + 1)] - uField[IX(i, j - 1)]) * 0.5;
              const eps = 30.0; // strength
              const fx = eps * (Ny_n * vort);
              const fy = eps * (-Nx_n * vort);
              uField[idx] += fx * dt;
              vField[idx] += fy * dt;
            }
          }
        }

        function velStep(uField, vField, u0Field, v0Field, visc, dtLocal) {
          addSource(uField, u0Field, 1.0);
          addSource(vField, v0Field, 1.0);
          u0Field.fill(0);
          v0Field.fill(0);

          diffuse(1, uField, uField.slice(), visc, dtLocal);
          diffuse(2, vField, vField.slice(), visc, dtLocal);

          const u_old = uField.slice(),
            v_old = vField.slice();
          advect(1, uField, u_old, u_old, v_old, dtLocal);
          advect(2, vField, v_old, u_old, v_old, dtLocal);

          if (vorticity_conf) vorticityConfinement(uField, vField);
          project(
            uField,
            vField,
            new Float32Array(size),
            new Float32Array(size)
          );
        }

        function densStep(xField, x0Field, uField, vField, diff, dtLocal) {
          addSource(xField, x0Field, 1.0);
          x0Field.fill(0);
          diffuse(0, xField, xField.slice(), diff, dtLocal);
          advect(0, xField, xField.slice(), uField, vField, dtLocal);
        }

        function densToColor(v) {
          const t = Math.min(1, v);
          if (t < 0.33) {
            const u = t / 0.33;
            return [
              Math.round(30 * (1 - u) + 0 * u),
              Math.round(60 * (1 - u) + 200 * u),
              Math.round(120 * (1 - u) + 255 * u),
            ];
          } else if (t < 0.66) {
            const u = (t - 0.33) / 0.33;
            return [
              Math.round(0 * (1 - u) + 240 * u),
              Math.round(200 * (1 - u) + 240 * u),
              Math.round(255 * (1 - u) + 90 * u),
            ];
          } else {
            const u = (t - 0.66) / 0.34;
            return [
              Math.round(240 * (1 - u) + 255 * u),
              Math.round(240 * (1 - u) + 80 * u),
              Math.round(90 * (1 - u) + 30 * u),
            ];
          }
        }

        function drawField() {
          const img = ctx.createImageData(canvas.width, canvas.height);
          const sx = canvas.width / N;
          const sy = canvas.height / GRID_H;

          let maxD = 0;
          for (let i = 0; i < size; i++) {
            if (dens[i] > maxD) maxD = dens[i];
          }
          const scale = maxD < 1e-6 ? 0 : 1.0 / maxD;

          for (let y = 0; y < canvas.height; y++) {
            const gy = Math.floor(y / sy);
            for (let x = 0; x < canvas.width; x++) {
              const gx = Math.floor(x / sx);
              const idx = gx + gy * N;
              const v = dens[idx] * scale;
              const [r, g, b] = densToColor(v);
              const p = (x + y * canvas.width) * 4;
              img.data[p] = r;
              img.data[p + 1] = g;
              img.data[p + 2] = b;
              img.data[p + 3] = Math.round(
                Math.min(230, 40 + 220 * Math.min(1, v))
              );
            }
          }
          ctx.putImageData(img, 0, 0);
        }

        function drawVelocityOverlay() {
          const step = Math.max(6, Math.floor(N / 30));
          ctx.lineWidth = 1;
          ctx.strokeStyle = "rgba(10,10,10,0.55)";
          for (let j = 0; j < GRID_H; j += step) {
            for (let i = 0; i < N; i += step) {
              const idx = i + j * N;
              const px = (i + 0.5) * (canvas.width / N);
              const py = (j + 0.5) * (canvas.height / GRID_H);
              const vx = u[idx] * 30;
              const vy = -v[idx] * 30;
              const x2 = px + vx;
              const y2 = py + vy;
              ctx.beginPath();
              ctx.moveTo(px, py);
              ctx.lineTo(x2, y2);
              ctx.stroke();
              const ang = Math.atan2(y2 - py, x2 - px);
              ctx.beginPath();
              ctx.moveTo(x2, y2);
              ctx.lineTo(
                x2 - 6 * Math.cos(ang - 0.35),
                y2 - 6 * Math.sin(ang - 0.35)
              );
              ctx.lineTo(
                x2 - 6 * Math.cos(ang + 0.35),
                y2 - 6 * Math.sin(ang + 0.35)
              );
              ctx.closePath();
              ctx.fillStyle = "rgba(8,8,8,0.6)";
              ctx.fill();
            }
          }
        }

        function canvasPosToGrid(x, y) {
          const gx = Math.floor((x / canvas.width) * N);
          const gy = Math.floor((y / canvas.height) * GRID_H);
          return [gx, gy];
        }

        function addDensityAtGrid(gx, gy, amount) {
          if (gx < 0 || gy < 0 || gx >= N || gy >= GRID_H) return;
          dens[IX(gx, gy)] += amount;
        }
        function addVelocityAtGrid(gx, gy, fx, fy) {
          if (gx < 0 || gy < 0 || gx >= N || gy >= GRID_H) return;
          u[IX(gx, gy)] += fx;
          v[IX(gx, gy)] += fy;
        }

        function spawnSourceAt(gx, gy, radius = 6, amount = sourceAmount) {
          for (let j = -radius; j <= radius; j++) {
            for (let i = -radius; i <= radius; i++) {
              if (i * i + j * j <= radius * radius) {
                const x = gx + i,
                  y = gy + j;
                if (x >= 0 && x < N && y >= 0 && y < GRID_H) {
                  dens[IX(x, y)] += amount * (1 - Math.hypot(i, j) / radius);
                }
              }
            }
          }
        }

        let lastTime = performance.now();
        let showVectors = false;

        function step() {
          if (!paused) {
            velStep(u, v, u_prev, v_prev, viscosity, dt);
            densStep(dens, dens_prev, u, v, diffusion, dt);
          }

          drawField();
          if (showVectors) drawVelocityOverlay();

          requestAnimationFrame(step);
        }

        canvas.addEventListener("pointerdown", (ev) => {
          canvas.setPointerCapture(ev.pointerId);
          mouseDown = true;
          rightDown =
            ev.button === 2 || (ev.pointerType === "touch" && ev.buttons === 2);
          const rect = canvas.getBoundingClientRect();
          const x = ev.clientX - rect.left;
          const y = ev.clientY - rect.top;
          lastX = x;
          lastY = y;
          const [gx, gy] = canvasPosToGrid(x, y);
          if (!rightDown) spawnSourceAt(gx, gy, 5, sourceAmount * 0.6);
        });

        canvas.addEventListener("pointermove", (ev) => {
          if (!mouseDown) return;
          const rect = canvas.getBoundingClientRect();
          const x = ev.clientX - rect.left;
          const y = ev.clientY - rect.top;
          const dx = x - lastX,
            dy = y - lastY;
          const [gx, gy] = canvasPosToGrid(x, y);
          const fx = (dx / canvas.width) * forceStrength;
          const fy = -(dy / canvas.height) * forceStrength;
          if (!rightDown) {
            spawnSourceAt(gx, gy, 2, sourceAmount * 0.4);
            addVelocityAtGrid(gx, gy, fx * 0.06, fy * 0.06);
          } else {
            addVelocityAtGrid(gx, gy, fx * 0.12, fy * 0.12);
          }
          lastX = x;
          lastY = y;
        });

        canvas.addEventListener("pointerup", (ev) => {
          mouseDown = false;
          rightDown = false;
          try {
            canvas.releasePointerCapture(ev.pointerId);
          } catch (e) {}
        });

        canvas.addEventListener("contextmenu", (e) => {
          e.preventDefault();
        });

        window.addEventListener("keydown", (e) => {
          if (e.key === " ") {
            paused = !paused;
            pauseBtn.textContent = paused ? "Reanudar" : "Pausa";
            e.preventDefault();
          }
          if (e.key === "v") {
            showVectors = !showVectors;
          }
          if (e.key === "c") {
            clearFields();
          }
        });

        viscSlider.addEventListener("input", () => {
          viscosity = parseFloat(viscSlider.value);
          viscVal.textContent = viscosity.toFixed(4);
        });
        diffSlider.addEventListener("input", () => {
          diffusion = parseFloat(diffSlider.value);
          diffVal.textContent = diffusion.toFixed(4);
        });
        srcSlider.addEventListener("input", () => {
          sourceAmount = parseFloat(srcSlider.value);
          srcVal.textContent = sourceAmount.toFixed(0);
        });
        forceSlider.addEventListener("input", () => {
          forceStrength = parseFloat(forceSlider.value);
          forceVal.textContent = forceStrength.toFixed(0);
        });
        itersSlider.addEventListener("input", () => {
          solverIters = parseInt(itersSlider.value, 10);
          itersVal.textContent = solverIters;
        });
        vortToggle.addEventListener("change", () => {
          vorticity_conf = vortToggle.checked;
          vortVal.textContent = vorticity_conf ? "ON" : "OFF";
        });

        pauseBtn.addEventListener("click", () => {
          paused = !paused;
          pauseBtn.textContent = paused ? "Reanudar" : "Pausa";
        });
        clearBtn.addEventListener("click", () => {
          clearFields();
        });
        spawnBtn.addEventListener("click", () => {
          spawnSourceAt(
            Math.floor(N / 2),
            Math.floor(GRID_H / 2),
            Math.floor(Math.min(N, GRID_H) / 7),
            sourceAmount * 1.2
          );
        });
        randomBtn.addEventListener("click", () => {
          for (let i = 0; i < 500; i++) {
            spawnSourceAt(
              Math.floor(Math.random() * N),
              Math.floor(Math.random() * GRID_H),
              2,
              Math.random() * sourceAmount
            );
          }
        });
        exportPNG.addEventListener("click", () => {
          const url = canvas.toDataURL("image/png");
          const a = document.createElement("a");
          a.href = url;
          a.download = "fluid_snapshot.png";
          a.click();
        });

        resSelect.addEventListener("change", () => {
          initGridFromSelect();
        });

        initGridFromSelect();
        viscVal.textContent = viscosity.toFixed(4);
        diffVal.textContent = diffusion.toFixed(4);
        srcVal.textContent = sourceAmount.toFixed(0);
        forceVal.textContent = forceStrength.toFixed(0);
        itersVal.textContent = solverIters;
        vortVal.textContent = vorticity_conf ? "ON" : "OFF";
        ctx.imageSmoothingEnabled = false;
        requestAnimationFrame(step);
        window._fluid = {
          dens,
          u,
          v,
          spawnSourceAt,
          clearFields,
          setVisc: (x) => {
            viscosity = x;
            viscSlider.value = x;
            viscVal.textContent = x.toFixed(4);
          },
        };
      })();
    </script>
  </body>
</html>
